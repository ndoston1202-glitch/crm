name: Android ilova

on:
  push:
    branches: [main]
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK yig'ish
        working-directory: mobile/android
        run: gradle assembleRelease --no-daemon

      - name: Nomini o'zgartirish
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk CRM-yozuvlar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CRM-yozuvlar-apk
          path: CRM-yozuvlar.apk

      - name: APK ni repozitoriyga joylash (CRM serveri "Yangilash" orqali oladi)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cp CRM-yozuvlar.apk mobile/release/CRM-yozuvlar.apk
          printf '{"versionCode": %s, "versionName": "1.0.%s"}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > mobile/release/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/release
          git commit -m "Android ilova 1.0.$GITHUB_RUN_NUMBER"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: Release ga joylash (main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android ilova (oxirgi versiya)
          body: "CRM yozuvlar — qo'ng'iroq yozuvlarini CRM ga avtomatik yuklaydi. Telefonga CRM-yozuvlar.apk ni yuklab o'rnating."
          files: CRM-yozuvlar.apk
          make_latest: true
