; /etc/asterisk/extensions.conf ga qo'shing.
; func_curl moduli yoqilgan bo'lishi kerak (module show like curl).

[globals]
CRM_URL=https://crm.example.uz
CRM_TOKEN=ASTERISK_WEBHOOK_TOKEN_QIYMATI
CRM_UPLOAD=/usr/local/bin/crm-upload.sh
MONITOR=/var/spool/asterisk/monitor

; ===== KIRUVCHI qo'ng'iroqlar =====
; Trunkdan kelgan qo'ng'iroqni shu kontekstga yo'naltiring (yoki mavjud kontekstingizga shu qatorlarni qo'shing).
[crm-inbound]
exten => _X.,1,NoOp(CRM kiruvchi: ${CALLERID(num)})
 same => n,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(CRM_R=${CURL(${CRM_URL}/telephony/webhook/?token=${CRM_TOKEN}&event=ring&direction=in&uniqueid=${UNIQUEID}&phone=${URIENCODE(${CALLERID(num)})})})
 same => n,Set(CHANNEL(hangup_handler_push)=crm-hangup,s,1)
 ; b — faqat suhbat ulanganda yozadi; yozuv tugagach fayl CRMga yuklanadi
 same => n,MixMonitor(${MONITOR}/${UNIQUEID}.wav,b,${CRM_UPLOAD} uniqueid=${UNIQUEID} ${MONITOR}/${UNIQUEID}.wav)
 ; Operatorlar telefonlari (yoki Queue(...) ishlating — U() o'rniga Queue ning gosub parametri)
 same => n,Dial(PJSIP/101&PJSIP/102&PJSIP/103,40,U(crm-answered^${UNIQUEID}))
 same => n,Hangup()

; Operator go'shakni ko'targanda — qaysi ichki raqam javob berganini CRMga yuboradi
[crm-answered]
exten => s,1,Set(CRM_R=${CURL(${CRM_URL}/telephony/webhook/?token=${CRM_TOKEN}&event=answer&uniqueid=${ARG1}&extension=${CHANNEL(endpoint)})})
 same => n,Return()

[crm-hangup]
exten => s,1,Set(CRM_R=${CURL(${CRM_URL}/telephony/webhook/?token=${CRM_TOKEN}&event=hangup&uniqueid=${UNIQUEID}&disposition=${DIALSTATUS}&duration=${CDR(billsec)})})
 same => n,Return()

; ===== CHIQUVCHI: CRMdan bir bosishda qo'ng'iroq =====
; CRM AMI orqali avval operator telefonini chaqiradi, u ko'targach shu kontekstda mijoz raqami teriladi.
; CRM_CALL_ID o'zgaruvchisini CRM o'zi beradi.
[crm-outbound]
exten => _X.,1,NoOp(CRM chiquvchi: ${EXTEN}, call_id=${CRM_CALL_ID})
 same => n,Set(CHANNEL(hangup_handler_push)=crm-hangup-out,s,1)
 same => n,MixMonitor(${MONITOR}/crm-${CRM_CALL_ID}.wav,b,${CRM_UPLOAD} call_id=${CRM_CALL_ID} ${MONITOR}/crm-${CRM_CALL_ID}.wav)
 ; "trunk" — sizning provayder trunkingiz nomi; raqam formatini kerak bo'lsa o'zgartiring
 same => n,Dial(PJSIP/${EXTEN}@trunk,60,U(crm-answered-out^${CRM_CALL_ID}))
 same => n,Hangup()

[crm-answered-out]
exten => s,1,Set(CRM_R=${CURL(${CRM_URL}/telephony/webhook/?token=${CRM_TOKEN}&event=answer&call_id=${ARG1})})
 same => n,Return()

[crm-hangup-out]
exten => s,1,Set(CRM_R=${CURL(${CRM_URL}/telephony/webhook/?token=${CRM_TOKEN}&event=hangup&call_id=${CRM_CALL_ID}&disposition=${DIALSTATUS}&duration=${CDR(billsec)})})
 same => n,Return()
