{% if page.has_other_pages %}
<nav class="mt-3"><ul class="pagination">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{{ querystring }}&page={{ page.previous_page_number }}">&laquo;</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">{{ page.number }} / {{ page.paginator.num_pages }}</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{{ querystring }}&page={{ page.next_page_number }}">&raquo;</a></li>{% endif %}
</ul></nav>
{% endif %}
